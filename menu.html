<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daftar Menu – Restoran Nusantara</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#f8f1e3; --card:#ffffff; --brown:#4a2f1d; --muted:#7a6552;
  --gold:#c19a3b; --green:#1f4d3a; --green-d:#163a2b; --line:#e8dcc2; --shadow:rgba(74,47,29,.14);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--cream:#17201b;--card:#212c25;--brown:#f3e8d2;--muted:#b9ab94;--gold:#d9b455;--green:#2f7a5a;--green-d:#256248;--line:#34443a;--shadow:rgba(0,0,0,.45)}
}
:root[data-theme="dark"]{--cream:#17201b;--card:#212c25;--brown:#f3e8d2;--muted:#b9ab94;--gold:#d9b455;--green:#2f7a5a;--green-d:#256248;--line:#34443a;--shadow:rgba(0,0,0,.45)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--brown);font-family:'Poppins',system-ui,sans-serif;line-height:1.6}
header.hero{background:linear-gradient(135deg,var(--green-d),var(--green));color:#fff;text-align:center;padding:48px 20px 56px;position:relative}
header.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.brand{letter-spacing:.3em;font-size:.75rem;color:#e6cf8f;text-transform:uppercase}
header.hero h1{font-family:'Playfair Display',Georgia,serif;font-size:clamp(1.9rem,5vw,3rem);margin:8px 0}
header.hero p{max-width:560px;margin:0 auto;opacity:.92}
main{max-width:1100px;margin:0 auto;padding:28px 16px 56px}
.tabs{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:-4px 0 28px}
.tab{border:1.5px solid var(--gold);background:var(--card);color:var(--brown);font:500 1rem 'Poppins',sans-serif;padding:10px 22px;border-radius:999px;cursor:pointer;min-height:44px;transition:.2s}
.tab:hover{transform:translateY(-2px);box-shadow:0 6px 14px var(--shadow)}
.tab.active{background:var(--green);color:#fff;border-color:var(--green)}
.sec-title{font-family:'Playfair Display',Georgia,serif;font-size:1.6rem;text-align:center;margin:0 0 4px}
.sec-sub{text-align:center;color:var(--muted);margin:0 0 24px;font-size:.92rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 4px 12px var(--shadow);transition:transform .25s,box-shadow .25s;animation:up .45s both}
.card:hover{transform:translateY(-8px);box-shadow:0 16px 30px var(--shadow)}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.pic{height:180px;display:flex;align-items:center;justify-content:center;font-size:5.5rem;position:relative;overflow:hidden;cursor:pointer}
.pic img{width:100%;height:100%;object-fit:cover}
.pic span{transition:transform .3s;filter:drop-shadow(0 6px 8px rgba(0,0,0,.25))}
.card:hover .pic span{transform:scale(1.15) rotate(-4deg)}
.body{padding:16px 18px 18px;display:flex;flex-direction:column;flex:1}
.body h3{margin:0 0 4px;font-family:'Playfair Display',Georgia,serif;font-size:1.2rem}
.body p{margin:0 0 12px;color:var(--muted);font-size:.88rem;flex:1}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.price{font-weight:600;color:var(--gold);font-size:1.05rem}
.btn{border:0;background:var(--green);color:#fff;font:500 .88rem 'Poppins',sans-serif;padding:10px 16px;border-radius:10px;cursor:pointer;min-height:42px;transition:.2s;text-decoration:none;display:inline-block;text-align:center}
.btn:hover{background:var(--green-d);transform:translateY(-1px)}
.btn.gold{background:var(--gold);color:#2b1c10}
.btn.gold:hover{background:#d6ae4d}
/* Modal */
.modal{position:fixed;inset:0;background:rgba(20,12,6,.65);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal.open{display:flex}
.dialog{background:var(--card);color:var(--brown);border-radius:20px;max-width:440px;width:100%;max-height:92vh;overflow:auto;position:relative;animation:pop .28s both}
@keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
.dialog .pic{height:230px;font-size:7.5rem;cursor:default}
.dialog .body{padding:20px 22px 24px}
.dialog h2{font-family:'Playfair Display',Georgia,serif;margin:0 0 4px}
.tag{display:inline-block;font-size:.75rem;background:var(--cream);border:1px solid var(--line);padding:2px 10px;border-radius:999px;color:var(--muted);margin-bottom:10px}
.close{position:absolute;top:10px;right:12px;width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.9);color:#333;font-size:1.4rem;cursor:pointer;z-index:2}
.dialog .btn{width:100%;margin-top:14px}
footer{text-align:center;color:var(--muted);font-size:.85rem;padding:20px 16px 28px;border-top:1px solid var(--line)}
@media (max-width:520px){.grid{grid-template-columns:1fr}.tab{padding:10px 16px;font-size:.92rem}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="hero">
  <div class="brand">Restoran</div>
  <h1>Nusantara</h1>
  <p>Cita rasa autentik dari berbagai penjuru Indonesia, disajikan hangat untuk Anda.</p>
</header>

<main>
  <div class="tabs" role="tablist" aria-label="Kategori menu"></div>
  <h2 class="sec-title" id="secTitle"></h2>
  <p class="sec-sub" id="secSub"></p>
  <div class="grid" id="grid"></div>
</main>

<div class="modal" id="modal" aria-hidden="true">
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="mName">
    <button class="close" id="mClose" aria-label="Tutup">&times;</button>
    <div class="pic" id="mPic"></div>
    <div class="body">
      <span class="tag" id="mTag"></span>
      <h2 id="mName"></h2>
      <p id="mDesc" style="color:var(--muted);margin:6px 0 10px"></p>
      <div class="price" id="mPrice" style="font-size:1.4rem"></div>
      <a class="btn gold" id="mOrder" target="_blank" rel="noopener">Pesan Sekarang</a>
    </div>
  </div>
</div>

<footer>© Restoran Nusantara · Jl. Contoh No. 123, Pamulang · Buka setiap hari 10.00 – 22.00 WIB</footer>

<script>
/* ============ PENGATURAN ============ */
// GANTI dengan nomor WhatsApp restoran sebenarnya (format 62, tanpa + atau 0 di depan)
const WA_NUMBER = "6281234567890";

/* ============ DATA MENU ============
   Setiap menu tampil dengan ilustrasi emoji (emoji + warna latar).
   Untuk memakai FOTO sendiri: tambahkan properti  img: "images/nama-foto.jpg"
   pada menu yang diinginkan, contoh:
   { name:"Rendang Sapi", ..., img:"images/rendang.jpg" }  */
const MENU = {
  makanan: { label:"🍛 Makanan", title:"Makanan", sub:"Hidangan utama khas Nusantara", items:[
    { name:"Nasi Goreng Nusantara", price:25000, emoji:"🍚", bg:["#e9a23b","#c0561f"], origin:"Seluruh Indonesia", desc:"Nasi goreng bumbu rempah dengan telur mata sapi, ayam suwir, acar, dan kerupuk." },
    { name:"Rendang Sapi", price:35000, emoji:"🥘", bg:["#8a3b1c","#4a1e0e"], origin:"Minangkabau, Sumatera Barat", desc:"Daging sapi empuk dimasak berjam-jam dalam santan dan rempah hingga meresap sempurna." },
    { name:"Ayam Bakar", price:30000, emoji:"🍗", bg:["#d9822b","#8f3e12"], origin:"Jawa", desc:"Ayam dibumbu manis gurih lalu dibakar, disajikan dengan sambal terasi dan lalapan." },
    { name:"Sate Ayam", price:28000, emoji:"🍢", bg:["#b8651f","#6b3010"], origin:"Madura", desc:"Sate ayam bakar dengan bumbu kacang kental, lontong, dan bawang goreng." },
    { name:"Gado-Gado", price:20000, emoji:"🥗", bg:["#6fa24a","#2f6a35"], origin:"Betawi, Jakarta", desc:"Sayuran segar, tahu, tempe, dan telur dengan siraman saus kacang khas." }
  ]},
  minuman: { label:"🥤 Minuman", title:"Minuman", sub:"Penyegar dahaga ala Nusantara", items:[
    { name:"Es Teh Manis", price:8000, emoji:"🧋", bg:["#c98a3a","#8a521a"], origin:"Seluruh Indonesia", desc:"Teh melati seduh pekat dengan gula, disajikan dingin dengan es batu." },
    { name:"Es Jeruk", price:10000, emoji:"🍊", bg:["#f4a62a","#e0701a"], origin:"Seluruh Indonesia", desc:"Perasan jeruk segar yang manis asam, menyegarkan di cuaca panas." },
    { name:"Es Cendol", price:15000, emoji:"🍧", bg:["#7fb06b","#2f7a4a"], origin:"Jawa Barat", desc:"Cendol hijau kenyal, santan, dan sirup gula merah dengan es serut." },
    { name:"Kopi Gula Aren", price:18000, emoji:"☕", bg:["#7a4a2a","#3a2012"], origin:"Nusantara", desc:"Espresso, susu segar, dan gula aren asli dengan aroma karamel yang lembut." },
    { name:"Wedang Jahe", price:12000, emoji:"🫖", bg:["#d6a047","#8a5a1f"], origin:"Jawa Tengah", desc:"Minuman jahe hangat dengan gula batu dan serai, pas untuk menghangatkan badan." }
  ]},
  dessert: { label:"🍰 Dessert", title:"Dessert", sub:"Manis penutup yang berkesan", items:[
    { name:"Pisang Goreng", price:15000, emoji:"🍌", bg:["#f2c34a","#c8861f"], origin:"Seluruh Indonesia", desc:"Pisang kepok digoreng renyah, ditaburi keju dan cokelat atau madu." },
    { name:"Klepon", price:12000, emoji:"🟢", bg:["#7cb36a","#357a3f"], origin:"Jawa", desc:"Bola ketan isi gula merah cair, digulung parutan kelapa segar." },
    { name:"Es Teler", price:18000, emoji:"🥥", bg:["#e6a0b0","#b8566e"], origin:"Jakarta", desc:"Alpukat, kelapa muda, nangka, dan susu kental manis dengan es serut." }
  ]}
};

/* ============ LOGIKA ============ */
const rupiah = n => "Rp" + n.toLocaleString("id-ID");
const grid = document.getElementById("grid");
const tabsEl = document.querySelector(".tabs");
const modal = document.getElementById("modal");
let lastFocus = null;

function art(item){
  return item.img
    ? `<img src="${item.img}" alt="${item.name}" loading="lazy">`
    : `<span aria-hidden="true">${item.emoji}</span>`;
}
function bgOf(item){ return item.img ? "" : `background:linear-gradient(135deg,${item.bg[0]},${item.bg[1]})`; }

function render(key){
  const cat = MENU[key];
  document.getElementById("secTitle").textContent = cat.title;
  document.getElementById("secSub").textContent = cat.sub;
  grid.innerHTML = cat.items.map((it,i)=>`
    <article class="card" style="animation-delay:${i*70}ms">
      <div class="pic" style="${bgOf(it)}" data-k="${key}" data-i="${i}" role="img" aria-label="${it.name}">${art(it)}</div>
      <div class="body">
        <h3>${it.name}</h3>
        <p>${it.desc}</p>
        <div class="row">
          <span class="price">${rupiah(it.price)}</span>
          <button class="btn" data-k="${key}" data-i="${i}">Lihat Detail</button>
        </div>
      </div>
    </article>`).join("");
  tabsEl.querySelectorAll(".tab").forEach(t=>{
    const on = t.dataset.k===key; t.classList.toggle("active",on); t.setAttribute("aria-selected",on);
  });
}

tabsEl.innerHTML = Object.entries(MENU).map(([k,c])=>`<button class="tab" role="tab" data-k="${k}">${c.label}</button>`).join("");
tabsEl.addEventListener("click",e=>{ const t=e.target.closest(".tab"); if(t) render(t.dataset.k); });

grid.addEventListener("click",e=>{
  const el = e.target.closest("[data-k][data-i]"); if(!el) return;
  openModal(el.dataset.k, +el.dataset.i);
});

function openModal(k,i){
  const it = MENU[k].items[i];
  lastFocus = document.activeElement;
  const pic = document.getElementById("mPic");
  pic.style.cssText = bgOf(it); pic.innerHTML = art(it);
  document.getElementById("mTag").textContent = MENU[k].title + " · " + it.origin;
  document.getElementById("mName").textContent = it.name;
  document.getElementById("mDesc").textContent = it.desc;
  document.getElementById("mPrice").textContent = rupiah(it.price);
  const msg = `Halo, saya ingin memesan:\n- ${it.name} (${rupiah(it.price)})\n\nTerima kasih.`;
  document.getElementById("mOrder").href = `https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(msg)}`;
  modal.classList.add("open"); modal.setAttribute("aria-hidden","false");
  document.body.style.overflow="hidden";
  document.getElementById("mClose").focus();
}
function closeModal(){
  modal.classList.remove("open"); modal.setAttribute("aria-hidden","true");
  document.body.style.overflow="";
  if(lastFocus) lastFocus.focus();
}
document.getElementById("mClose").onclick = closeModal;
modal.addEventListener("click",e=>{ if(e.target===modal) closeModal(); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape" && modal.classList.contains("open")) closeModal(); });

render("makanan"); // tampilkan Makanan langsung saat halaman dibuka
</script>
</body>
</html>
