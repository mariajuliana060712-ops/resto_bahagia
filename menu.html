<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover"
    >

    <title>Daftar Menu – Restoran Nusantara</title>

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600&display=swap"
        rel="stylesheet"
    >

    <style>
        /* ==================================================
           VARIABEL WARNA
        ================================================== */

        :root {
            --cream: #f8f1e3;
            --card: #ffffff;
            --brown: #4a2f1d;
            --muted: #7a6552;
            --gold: #c19a3b;
            --green: #1f4d3a;
            --green-d: #163a2b;
            --line: #e8dcc2;
            --shadow: rgba(74, 47, 29, .14);

            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }

        /* ==================================================
           DARK MODE
        ================================================== */

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --cream: #17201b;
                --card: #212c25;
                --brown: #f3e8d2;
                --muted: #b9ab94;
                --gold: #d9b455;
                --green: #2f7a5a;
                --green-d: #256248;
                --line: #34443a;
                --shadow: rgba(0, 0, 0, .45);
            }
        }

        :root[data-theme="dark"] {
            --cream: #17201b;
            --card: #212c25;
            --brown: #f3e8d2;
            --muted: #b9ab94;
            --gold: #d9b455;
            --green: #2f7a5a;
            --green-d: #256248;
            --line: #34443a;
            --shadow: rgba(0, 0, 0, .45);
        }

        html {
            scroll-padding-top: env(safe-area-inset-top, 0px);
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        /* ==================================================
           BODY
        ================================================== */

        body {
            margin: 0;
            background: var(--cream);
            color: var(--brown);
            font-family: 'Poppins', system-ui, sans-serif;
            line-height: 1.6;
        }

        /* ==================================================
           HEADER
        ================================================== */

        header.hero {
            background: linear-gradient(
                135deg,
                var(--green-d),
                var(--green)
            );

            color: #fff;
            text-align: center;
            padding: 48px 20px 56px;
            position: relative;
        }

        header.hero::after {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 6px;

            background: linear-gradient(
                90deg,
                transparent,
                var(--gold),
                transparent
            );
        }

        .brand {
            letter-spacing: .3em;
            font-size: .75rem;
            color: #e6cf8f;
            text-transform: uppercase;
        }

        header.hero h1 {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: clamp(1.9rem, 5vw, 3rem);
            margin: 8px 0;
        }

        header.hero p {
            max-width: 560px;
            margin: 0 auto;
            opacity: .92;
        }

        /* ==================================================
           MAIN
        ================================================== */

        main {
            max-width: 1100px;
            margin: 0 auto;
            padding: 28px 16px 56px;
        }

        /* ==================================================
           KATEGORI MENU
        ================================================== */

        .tabs {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin: -4px 0 28px;
        }

        .tab {
            border: 1.5px solid var(--gold);
            background: var(--card);
            color: var(--brown);

            font: 500 1rem 'Poppins', sans-serif;

            padding: 10px 22px;
            border-radius: 999px;

            cursor: pointer;
            min-height: 44px;

            transition: .2s;
        }

        .tab:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 14px var(--shadow);
        }

        .tab.active {
            background: var(--green);
            color: #fff;
            border-color: var(--green);
        }

        /* ==================================================
           JUDUL SECTION
        ================================================== */

        .sec-title {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 1.6rem;
            text-align: center;
            margin: 0 0 4px;
        }

        .sec-sub {
            text-align: center;
            color: var(--muted);
            margin: 0 0 24px;
            font-size: .92rem;
        }

        /* ==================================================
           GRID MENU
        ================================================== */

        .grid {
            display: grid;
            grid-template-columns: repeat(
                auto-fill,
                minmax(250px, 1fr)
            );
            gap: 22px;
        }

        /* ==================================================
           CARD MENU
        ================================================== */

        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 18px;
            overflow: hidden;

            display: flex;
            flex-direction: column;

            box-shadow: 0 4px 12px var(--shadow);

            transition:
                transform .25s,
                box-shadow .25s;

            animation: up .45s both;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 16px 30px var(--shadow);
        }

        /* ==================================================
           ANIMASI
        ================================================== */

        @keyframes up {
            from {
                opacity: 0;
                transform: translateY(14px);
            }

            to {
                opacity: 1;
                transform: none;
            }
        }

        /* ==================================================
           GAMBAR MENU
        ================================================== */

        .pic {
            height: 180px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 5.5rem;

            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        .pic img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .pic span {
            transition: transform .3s;
            filter: drop-shadow(
                0 6px 8px rgba(0, 0, 0, .25)
            );
        }

        .card:hover .pic span {
            transform: scale(1.15) rotate(-4deg);
        }

        /* ==================================================
           ISI CARD
        ================================================== */

        .body {
            padding: 16px 18px 18px;

            display: flex;
            flex-direction: column;

            flex: 1;
        }

        .body h3 {
            margin: 0 0 4px;

            font-family: 'Playfair Display', Georgia, serif;
            font-size: 1.2rem;
        }

        .body p {
            margin: 0 0 12px;

            color: var(--muted);
            font-size: .88rem;

            flex: 1;
        }

        .row {
            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 10px;
        }

        /* ==================================================
           HARGA
        ================================================== */

        .price {
            font-weight: 600;
            color: var(--gold);
            font-size: 1.05rem;
        }

        /* ==================================================
           BUTTON
        ================================================== */

        .btn {
            border: 0;
            background: var(--green);
            color: #fff;

            font: 500 .88rem 'Poppins', sans-serif;

            padding: 10px 16px;
            border-radius: 10px;

            cursor: pointer;
            min-height: 42px;

            transition: .2s;

            text-decoration: none;
            display: inline-block;
            text-align: center;
        }

        .btn:hover {
            background: var(--green-d);
            transform: translateY(-1px);
        }

        .btn.gold {
            background: var(--gold);
            color: #2b1c10;
        }

        .btn.gold:hover {
            background: #d6ae4d;
        }

        /* ==================================================
           MODAL
        ================================================== */

        .modal {
            position: fixed;
            inset: 0;

            background: rgba(20, 12, 6, .65);

            display: none;
            align-items: center;
            justify-content: center;

            padding: 16px;
            z-index: 50;
        }

        .modal.open {
            display: flex;
        }

        .dialog {
            background: var(--card);
            color: var(--brown);

            border-radius: 20px;

            max-width: 440px;
            width: 100%;

            max-height: 92vh;
            overflow: auto;

            position: relative;

            animation: pop .28s both;
        }

        /* ==================================================
           ANIMASI MODAL
        ================================================== */

        @keyframes pop {
            from {
                opacity: 0;
                transform: scale(.92);
            }

            to {
                opacity: 1;
                transform: none;
            }
        }

        .dialog .pic {
            height: 230px;
            font-size: 7.5rem;
            cursor: default;
        }

        .dialog .body {
            padding: 20px 22px 24px;
        }

        .dialog h2 {
            font-family: 'Playfair Display', Georgia, serif;
            margin: 0 0 4px;
        }

        /* ==================================================
           TAG KATEGORI
        ================================================== */

        .tag {
            display: inline-block;

            font-size: .75rem;

            background: var(--cream);
            border: 1px solid var(--line);

            padding: 2px 10px;
            border-radius: 999px;

            color: var(--muted);

            margin-bottom: 10px;
        }

        /* ==================================================
           BUTTON CLOSE MODAL
        ================================================== */

        .close {
            position: absolute;
            top: 10px;
            right: 12px;

            width: 40px;
            height: 40px;

            border-radius: 50%;
            border: 0;

            background: rgba(255, 255, 255, .9);
            color: #333;

            font-size: 1.4rem;

            cursor: pointer;
            z-index: 2;
        }

        .dialog .btn {
            width: 100%;
            margin-top: 14px;
        }

        /* ==================================================
           FOOTER
        ================================================== */

        footer {
            text-align: center;

            color: var(--muted);
            font-size: .85rem;

            padding: 20px 16px 28px;

            border-top: 1px solid var(--line);
        }

        /* ==================================================
           RESPONSIVE
        ================================================== */

        @media (max-width: 520px) {
            .grid {
                grid-template-columns: 1fr;
            }

            .tab {
                padding: 10px 16px;
                font-size: .92rem;
            }
        }

        /* ==================================================
           REDUCED MOTION
        ================================================== */

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>

<body>

    <!-- ==================================================
         HEADER
    ================================================== -->

    <header class="hero">
        <div class="brand">Restoran</div>

        <h1>Nusantara</h1>

        <p>
            Cita rasa autentik dari berbagai penjuru Indonesia,
            disajikan hangat untuk Anda.
        </p>
    </header>


    <!-- ==================================================
         KONTEN UTAMA
    ================================================== -->

    <main>

        <!-- Tombol Kategori -->
        <div
            class="tabs"
            role="tablist"
            aria-label="Kategori menu"
        ></div>

        <!-- Judul Kategori -->
        <h2
            class="sec-title"
            id="secTitle"
        ></h2>

        <p
            class="sec-sub"
            id="secSub"
        ></p>

        <!-- Daftar Menu -->
        <div
            class="grid"
            id="grid"
        ></div>

    </main>


    <!-- ==================================================
         MODAL DETAIL MENU
    ================================================== -->

    <div
        class="modal"
        id="modal"
        aria-hidden="true"
    >

        <div
            class="dialog"
            role="dialog"
            aria-modal="true"
            aria-labelledby="mName"
        >

            <!-- Tombol Tutup -->
            <button
                class="close"
                id="mClose"
                aria-label="Tutup"
            >
                &times;
            </button>

            <!-- Gambar / Emoji -->
            <div
                class="pic"
                id="mPic"
            ></div>

            <!-- Detail Menu -->
            <div class="body">

                <span
                    class="tag"
                    id="mTag"
                ></span>

                <h2 id="mName"></h2>

                <p
                    id="mDesc"
                    style="color:var(--muted); margin:6px 0 10px"
                ></p>

                <div
                    class="price"
                    id="mPrice"
                    style="font-size:1.4rem"
                ></div>

                <!-- Tombol Pesan -->
                <a
                    class="btn gold"
                    id="mOrder"
                    target="_blank"
                    rel="noopener"
                >
                    Pesan Sekarang
                </a>

            </div>
        </div>
    </div>


    <!-- ==================================================
         FOOTER
    ================================================== -->

    <footer>
        © Restoran Nusantara · Jl. Contoh No. 123, Pamulang ·
        Buka setiap hari 10.00 – 22.00 WIB
    </footer>


    <!-- ==================================================
         JAVASCRIPT
    ================================================== -->

    <script>

        /* ==================================================
           PENGATURAN
        ================================================== */

        // Ganti dengan nomor WhatsApp restoran sebenarnya.
        // Format: 62, tanpa tanda + atau 0 di depan.

        const WA_NUMBER = "6281234567890";


        /* ==================================================
           DATA MENU
        ==================================================

           Untuk menggunakan foto sendiri, tambahkan:

           img: "images/nama-foto.jpg"

           Contoh:

           {
               name: "Rendang Sapi",
               price: 35000,
               emoji: "🥘",
               bg: ["#8a3b1c", "#4a1e0e"],
               origin: "Minangkabau, Sumatera Barat",
               desc: "Deskripsi menu",
               img: "images/rendang.jpg"
           }

        ================================================== */

        const MENU = {

            /* =========================
               MAKANAN
            ========================= */

            makanan: {
                label: "🍛 Makanan",
                title: "Makanan",
                sub: "Hidangan utama khas Nusantara",

                items: [

                    {
                        name: "Nasi Goreng Nusantara",
                        price: 25000,
                        emoji: "🍚",
                        bg: ["#e9a23b", "#c0561f"],
                        origin: "Seluruh Indonesia",
                        desc: "Nasi goreng bumbu rempah dengan telur mata sapi, ayam suwir, acar, dan kerupuk."
                    },

                    {
                        name: "Rendang Sapi",
                        price: 35000,
                        emoji: "🥘",
                        bg: ["#8a3b1c", "#4a1e0e"],
                        origin: "Minangkabau, Sumatera Barat",
                        desc: "Daging sapi empuk dimasak berjam-jam dalam santan dan rempah hingga meresap sempurna."
                    },

                    {
                        name: "Ayam Bakar",
                        price: 30000,
                        emoji: "🍗",
                        bg: ["#d9822b", "#8f3e12"],
                        origin: "Jawa",
                        desc: "Ayam dibumbu manis gurih lalu dibakar, disajikan dengan sambal terasi dan lalapan."
                    },

                    {
                        name: "Sate Ayam",
                        price: 28000,
                        emoji: "🍢",
                        bg: ["#b8651f", "#6b3010"],
                        origin: "Madura",
                        desc: "Sate ayam bakar dengan bumbu kacang kental, lontong, dan bawang goreng."
                    },

                    {
                        name: "Gado-Gado",
                        price: 20000,
                        emoji: "🥗",
                        bg: ["#6fa24a", "#2f6a35"],
                        origin: "Betawi, Jakarta",
                        desc: "Sayuran segar, tahu, tempe, dan telur dengan siraman saus kacang khas."
                    }

                ]
            },


            /* =========================
               MINUMAN
            ========================= */

            minuman: {
                label: "🥤 Minuman",
                title: "Minuman",
                sub: "Penyegar dahaga ala Nusantara",

                items: [

                    {
                        name: "Es Teh Manis",
                        price: 8000,
                        emoji: "🧋",
                        bg: ["#c98a3a", "#8a521a"],
                        origin: "Seluruh Indonesia",
                        desc: "Teh melati seduh pekat dengan gula, disajikan dingin dengan es batu."
                    },

                    {
                        name: "Es Jeruk",
                        price: 10000,
                        emoji: "🍊",
                        bg: ["#f4a62a", "#e0701a"],
                        origin: "Seluruh Indonesia",
                        desc: "Perasan jeruk segar yang manis asam, menyegarkan di cuaca panas."
                    },

                    {
                        name: "Es Cendol",
                        price: 15000,
                        emoji: "🍧",
                        bg: ["#7fb06b", "#2f7a4a"],
                        origin: "Jawa Barat",
                        desc: "Cendol hijau kenyal, santan, dan sirup gula merah dengan es serut."
                    },

                    {
                        name: "Kopi Gula Aren",
                        price: 18000,
                        emoji: "☕",
                        bg: ["#7a4a2a", "#3a2012"],
                        origin: "Nusantara",
                        desc: "Espresso, susu segar, dan gula aren asli dengan aroma karamel yang lembut."
                    },

                    {
                        name: "Wedang Jahe",
                        price: 12000,
                        emoji: "🫖",
                        bg: ["#d6a047", "#8a5a1f"],
                        origin: "Jawa Tengah",
                        desc: "Minuman jahe hangat dengan gula batu dan serai, pas untuk menghangatkan badan."
                    }

                ]
            },


            /* =========================
               DESSERT
            ========================= */

            dessert: {
                label: "🍰 Dessert",
                title: "Dessert",
                sub: "Manis penutup yang berkesan",

                items: [

                    {
                        name: "Pisang Goreng",
                        price: 15000,
                        emoji: "🍌",
                        bg: ["#f2c34a", "#c8861f"],
                        origin: "Seluruh Indonesia",
                        desc: "Pisang kepok digoreng renyah, ditaburi keju dan cokelat atau madu."
                    },

                    {
                        name: "Klepon",
                        price: 12000,
                        emoji: "🟢",
                        bg: ["#7cb36a", "#357a3f"],
                        origin: "Jawa",
                        desc: "Bola ketan isi gula merah cair, digulung parutan kelapa segar."
                    },

                    {
                        name: "Es Teler",
                        price: 18000,
                        emoji: "🥥",
                        bg: ["#e6a0b0", "#b8566e"],
                        origin: "Jakarta",
                        desc: "Alpukat, kelapa muda, nangka, dan susu kental manis dengan es serut."
                    }

                ]
            }

        };


        /* ==================================================
           LOGIKA PROGRAM
        ================================================== */

        // Format angka menjadi Rupiah.
        const rupiah = (number) => {
            return "Rp" + number.toLocaleString("id-ID");
        };


        // Mengambil elemen HTML.
        const grid = document.getElementById("grid");
        const tabsEl = document.querySelector(".tabs");
        const modal = document.getElementById("modal");

        let lastFocus = null;


        /* ==================================================
           MEMBUAT GAMBAR / EMOJI MENU
        ================================================== */

        function art(item) {

            if (item.img) {
                return `
                    <img
                        src="${item.img}"
                        alt="${item.name}"
                        loading="lazy"
                    >
                `;
            }

            return `
                <span aria-hidden="true">
                    ${item.emoji}
                </span>
            `;
        }


        /* ==================================================
           BACKGROUND MENU
        ================================================== */

        function bgOf(item) {

            if (item.img) {
                return "";
            }

            return `
                background: linear-gradient(
                    135deg,
                    ${item.bg[0]},
                    ${item.bg[1]}
                )
            `;
        }


        /* ==================================================
           MENAMPILKAN MENU
        ================================================== */

        function render(key) {

            const category = MENU[key];

            // Judul kategori.
            document.getElementById("secTitle").textContent =
                category.title;

            // Deskripsi kategori.
            document.getElementById("secSub").textContent =
                category.sub;


            // Membuat kartu menu.
            grid.innerHTML = category.items
                .map((item, index) => {

                    return `
                        <article
                            class="card"
                            style="animation-delay:${index * 70}ms"
                        >

                            <div
                                class="pic"
                                style="${bgOf(item)}"
                                data-k="${key}"
                                data-i="${index}"
                                role="img"
                                aria-label="${item.name}"
                            >
                                ${art(item)}
                            </div>

                            <div class="body">

                                <h3>
                                    ${item.name}
                                </h3>

                                <p>
                                    ${item.desc}
                                </p>

                                <div class="row">

                                    <span class="price">
                                        ${rupiah(item.price)}
                                    </span>

                                    <button
                                        class="btn"
                                        data-k="${key}"
                                        data-i="${index}"
                                    >
                                        Lihat Detail
                                    </button>

                                </div>

                            </div>

                        </article>
                    `;

                })
                .join("");


            // Menentukan tab yang sedang aktif.
            tabsEl
                .querySelectorAll(".tab")
                .forEach((tab) => {

                    const active =
                        tab.dataset.k === key;

                    tab.classList.toggle(
                        "active",
                        active
                    );

                    tab.setAttribute(
                        "aria-selected",
                        active
                    );
                });
        }


        /* ==================================================
           MEMBUAT TOMBOL KATEGORI
        ================================================== */

        tabsEl.innerHTML = Object
            .entries(MENU)
            .map(([key, category]) => {

                return `
                    <button
                        class="tab"
                        role="tab"
                        data-k="${key}"
                    >
                        ${category.label}
                    </button>
                `;

            })
            .join("");


        /* ==================================================
           EVENT KLIK KATEGORI
        ================================================== */

        tabsEl.addEventListener("click", (event) => {

            const tab =
                event.target.closest(".tab");

            if (!tab) {
                return;
            }

            render(tab.dataset.k);
        });


        /* ==================================================
           EVENT KLIK MENU
        ================================================== */

        grid.addEventListener("click", (event) => {

            const element =
                event.target.closest("[data-k][data-i]");

            if (!element) {
                return;
            }

            openModal(
                element.dataset.k,
                Number(element.dataset.i)
            );
        });


        /* ==================================================
           MEMBUKA MODAL DETAIL
        ================================================== */

        function openModal(key, index) {

            const item =
                MENU[key].items[index];

            // Menyimpan elemen yang terakhir dipilih.
            lastFocus = document.activeElement;


            // Gambar / emoji.
            const picture =
                document.getElementById("mPic");

            picture.style.cssText =
                bgOf(item);

            picture.innerHTML =
                art(item);


            // Kategori dan asal menu.
            document.getElementById("mTag")
                .textContent =
                MENU[key].title +
                " · " +
                item.origin;


            // Nama menu.
            document.getElementById("mName")
                .textContent =
                item.name;


            // Deskripsi.
            document.getElementById("mDesc")
                .textContent =
                item.desc;


            // Harga.
            document.getElementById("mPrice")
                .textContent =
                rupiah(item.price);


            // Pesan WhatsApp.
            const message =
                `Halo, saya ingin memesan:\n- ${item.name} (${rupiah(item.price)})\n\nTerima kasih.`;


            document.getElementById("mOrder")
                .href =
                `https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(message)}`;


            // Menampilkan modal.
            modal.classList.add("open");

            modal.setAttribute(
                "aria-hidden",
                "false"
            );

            document.body.style.overflow =
                "hidden";


            // Fokus ke tombol close.
            document.getElementById("mClose")
                .focus();
        }


        /* ==================================================
           MENUTUP MODAL
        ================================================== */

        function closeModal() {

            modal.classList.remove("open");

            modal.setAttribute(
                "aria-hidden",
                "true"
            );

            document.body.style.overflow =
                "";


            // Mengembalikan fokus.
            if (lastFocus) {
                lastFocus.focus();
            }
        }


        /* ==================================================
           EVENT TOMBOL CLOSE
        ================================================== */

        document
            .getElementById("mClose")
            .onclick = closeModal;


        /* ==================================================
           MENUTUP MODAL KETIKA AREA LUAR DIKLIK
        ================================================== */

        modal.addEventListener("click", (event) => {

            if (event.target === modal) {
                closeModal();
            }
        });


        /* ==================================================
           MENUTUP MODAL DENGAN TOMBOL ESC
        ================================================== */

        document.addEventListener("keydown", (event) => {

            if (
                event.key === "Escape" &&
                modal.classList.contains("open")
            ) {
                closeModal();
            }
        });


        /* ==================================================
           MENU DEFAULT
        ================================================== */

        // Menampilkan kategori Makanan
        // ketika halaman pertama kali dibuka.

        render("makanan");

    </script>

</body>

</html>
